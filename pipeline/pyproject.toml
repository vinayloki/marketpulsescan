[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "marketpulse"
version = "0.1.0"
description = "MarketPulseScan — zero-cost Indian stock analysis pipeline"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<2.0",
    "requests>=2.31,<3.0",
    "yfinance>=0.2.40,<1.0",
    "feedparser>=6.0,<7.0",
    "pyarrow>=14.0,<18.0",
    "sqlalchemy>=2.0,<3.0",
    "scikit-learn>=1.4,<2.0",
    "nse-archives>=1.1.0,<2.0",
    "nsepython>=2.90",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pandas-stubs>=2.0",
]

[project.scripts]
marketpulse = "marketpulse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["marketpulse*"]

# ── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["marketpulse"]

# ── Mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "nsedata.*",
    "feedparser.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_return_any = false
strict = false
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
