name: MarketPulse — Daily Scan (New Pipeline)

# ═══════════════════════════════════════════════════════════════════════
#  Completely independent from the legacy daily_scan.yml.
#  No legacy code (scanner.py / ai_engine.py / export_static_api.py)
#  is touched by this workflow.
#
#  What it does:
#    1. Installs the new marketpulse pipeline package (pipeline/)
#    2. Runs:  python -m marketpulse scan
#    3. Validates the output bundle (manifest + schema checks)
#    4. Commits the bundle to the orphan branch 'marketpulse-data'
#       under api/v1/  (separate from legacy 'data' branch)
#    5. Triggers marketpulse-deploy.yml to push to GitHub Pages
#
#  Outputs (on marketpulse-data branch):
#    api/v1/manifest.json
#    api/v1/universe.json
#    api/v1/market.json
# ═══════════════════════════════════════════════════════════════════════

on:
  # ── Auto: every weekday after Indian market close (4:00 PM IST = 10:30 UTC) ──
  schedule:
    - cron: '30 10 * * 1-5'

  # ── Auto: also run whenever pipeline code changes land on main ─────────
  push:
    branches: [main, develop]
    paths:
      - 'pipeline/**'
      - 'schemas/**'

  # ── Allow other workflows (e.g. marketpulse-deploy.yml) to call this ───
  workflow_call:
    inputs:
      fixture:
        type: boolean
        default: false
      symbols:
        type: string
        default: ''

  # ── Manual one-click trigger from the Actions tab ─────────────────────
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Use fixture data (offline — no live market download)'
        type: boolean
        default: false
      symbols:
        description: 'Comma-separated symbol list (leave blank for full universe)'
        required: false
        default: ''
      run_id_override:
        description: 'Override run ID (default: gh-<run_number>)'
        required: false
        default: ''

concurrency:
  group: marketpulse-scan
  cancel-in-progress: false   # never cancel a live scan mid-flight

permissions:
  contents: write   # push to marketpulse-data branch

jobs:
  scan:
    name: Run MarketPulse Scan
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code branch ───────────────────────────────────────────
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: code
          fetch-depth: 0

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/pipeline/pyproject.toml

      - name: Install MarketPulse pipeline
        working-directory: code/pipeline
        run: pip install -e "."

      # ── 3. Run the new pipeline scan ──────────────────────────────────────
      - name: Run scan
        working-directory: code
        run: |
          RUN_ID="${{ inputs.run_id_override || format('gh-{0}', github.run_number) }}"
          FIXTURE_FLAG=""
          SYMBOLS_FLAG=""

          if [ "${{ inputs.fixture }}" == "true" ]; then
            FIXTURE_FLAG="--fixture"
          fi

          if [ -n "${{ inputs.symbols }}" ]; then
            SYMBOLS_FLAG="--symbols ${{ inputs.symbols }}"
          fi

          python -m marketpulse scan \
            $FIXTURE_FLAG \
            $SYMBOLS_FLAG \
            --output-dir /tmp/mp-bundle \
            --run-id "$RUN_ID"
        env:
          MPS_CACHE_DIR: /tmp/mps-cache
          MPS_OUTPUT_DIR: /tmp/mps-output

      # ── 4. Validate bundle schema ─────────────────────────────────────────
      - name: Validate bundle
        working-directory: code
        run: |
          python -m marketpulse publish \
            --bundle-dir /tmp/mp-bundle \
            --validate-only

      # ── 5. Verify non-empty data ──────────────────────────────────────────
      - name: Verify bundle health
        run: |
          python3 - <<'EOF'
          import json, sys
          from pathlib import Path

          api = Path("/tmp/mp-bundle/api/v1")

          with open(api / "manifest.json") as f:
              manifest = json.load(f)
          with open(api / "market.json") as f:
              market = json.load(f)
          with open(api / "universe.json") as f:
              universe = json.load(f)

          universe_count = len(universe.get("data", []))
          market_count   = len(market.get("data", []))
          file_count     = len(manifest.get("files", []))

          print(f"Universe symbols : {universe_count}")
          print(f"Market records   : {market_count}")
          print(f"Manifest files   : {file_count}")

          errors = []
          if universe_count == 0:
              errors.append("universe.json has 0 symbols")
          if market_count == 0:
              errors.append("market.json has 0 records")
          if file_count < 3:
              errors.append("manifest.json has < 3 files")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)

          print("Bundle health: OK ✓")
          EOF

      # ── 6. Publish bundle to marketpulse-data branch ──────────────────────
      - name: Publish to marketpulse-data branch
        run: |
          cd code
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or checkout orphan branch (completely separate from legacy 'data' branch)
          if git ls-remote --exit-code --heads origin marketpulse-data; then
            git fetch origin marketpulse-data
            git checkout marketpulse-data
          else
            echo "Branch 'marketpulse-data' not found — creating as orphan"
            git checkout --orphan marketpulse-data
            git rm -rf . 2>/dev/null || true
            git commit --allow-empty -m "chore: initialise marketpulse-data branch"
            git push -u origin marketpulse-data
          fi

          # Wipe old api/v1 and write fresh bundle
          rm -rf api/v1
          mkdir -p api/v1
          cp -r /tmp/mp-bundle/api/v1/* api/v1/

          # Write a lightweight metadata file for the deploy workflow
          echo "${{ github.run_number }}" > api/v1/.run_number

          git add api/
          git diff --staged --quiet \
            && echo "No data changes — nothing to commit." \
            || git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M UTC')  run=${{ github.run_number }}"

          git push origin marketpulse-data

      # ── 7. Job summary ────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path

          try:
              api = Path("/tmp/mp-bundle/api/v1")
              with open(api / "manifest.json") as f:
                  m = json.load(f)
              with open(api / "market.json") as f:
                  market = json.load(f)
              with open(api / "universe.json") as f:
                  universe = json.load(f)

              tops = sorted(market.get("data", []),
                            key=lambda r: r.get("score") or 0,
                            reverse=True)[:5]

              print("## MarketPulse Scan Summary")
              print(f"| Key | Value |")
              print(f"|-----|-------|")
              print(f"| **Generated** | {m.get('generated_at', 'n/a')} |")
              print(f"| **Run ID** | {m.get('run_id', 'n/a')} |")
              print(f"| **Universe** | {len(universe.get('data', []))} symbols |")
              print(f"| **Market records** | {len(market.get('data', []))} |")
              print()
              if tops:
                  print("### Top 5 by Score")
                  print("| # | Symbol | Score | Rec | Signals |")
                  print("|---|--------|-------|-----|---------|")
                  for i, r in enumerate(tops, 1):
                      sigs = ", ".join(r.get("signals", []))
                      print(f"| {i} | **{r.get('symbol','')}** | {r.get('score','n/a')} | {r.get('recommendation','—')} | {sigs} |")
          except Exception as e:
              print(f"## MarketPulse Scan")
              print(f"- **Status:** Could not read bundle ({e})")
          EOF

      - name: Report failure
        if: failure()
        run: |
          echo "## ❌ MarketPulse Scan Failed" >> $GITHUB_STEP_SUMMARY
          echo "- **Run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **[View log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})**" >> $GITHUB_STEP_SUMMARY
