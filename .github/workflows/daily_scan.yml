name: Daily NSE Market Scan

on:
  schedule:
    # 4:15 PM IST (10:45 UTC) Mon–Fri
    # NSE closes 3:30 PM IST — 45 min buffer for yfinance EOD data to settle
    - cron: '45 10 * * 1-5'
  workflow_dispatch:
    inputs:
      skip_scanner:
        description: 'Skip the 1-hour scan (fast export test only)'
        type: boolean
        default: false

# Prevent two runs from conflicting
concurrency:
  group: daily-scan
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. Python setup ───────────────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-actions.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-actions.txt

      # ── 3. Initialise SQLite DB (creates tables if first run) ─────────────
      - name: Initialise Database
        run: python -c "from database.init_db import init_db; init_db(); print('DB ready')"

      # ── 4. Main market scanner (produces scan_results/ JSON & CSV) ────────
      - name: Run Market Scanner
        if: ${{ !inputs.skip_scanner }}
        run: python scanner.py

      # ── 5. Supporting data enrichment steps (non-fatal) ──────────────────
      - name: Fetch Market News
        if: ${{ !inputs.skip_scanner }}
        run: python news_fetcher.py
        continue-on-error: true

      - name: Update Market Regime
        if: ${{ !inputs.skip_scanner }}
        run: python regime_filter.py
        continue-on-error: true

      - name: Run AI Intelligence Engine
        if: ${{ !inputs.skip_scanner }}
        run: python ai_engine.py
        continue-on-error: true
        timeout-minutes: 10

      - name: Run Prediction Engine
        if: ${{ !inputs.skip_scanner }}
        run: python prediction_engine.py --backtest-weeks 12
        continue-on-error: true
        timeout-minutes: 15



      # ── 7. Export DB to static JSON for serverless React app ─────────────
      - name: Export Static API
        run: python export_static_api.py

      # ── 8. Validate sector labels ─────────────────────────────────────────
      - name: Validate Sector Labels
        if: ${{ !inputs.skip_scanner }}
        continue-on-error: true
        run: |
          python -c "
          import json
          from config.sector_map import CANONICAL_SECTORS
          try:
              with open('scan_results/fundamentals.json') as f:
                  data = json.load(f)
              stocks = data.get('stocks', [])
              invalid = [s.get('s','?') for s in stocks if s.get('sector') not in CANONICAL_SECTORS]
              if invalid:
                  print(f'WARNING: {len(invalid)} stocks with non-canonical sectors')
              else:
                  print(f'OK: All {len(stocks)} sector labels valid')
          except Exception as e:
              print(f'Sector validation skipped: {e}')
          "

      # ── 9. Commit results ─────────────────────────────────────────────────
      - name: Commit and Push Results
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage scan results (powers GitHub Pages site + React static JSONs)
          git add scan_results/

          # Stage SQLite DB (powers new FastAPI / React platform)
          git add data/marketpulse.db 2>/dev/null || true

          # Stash everything so rebase is clean
          git stash push --include-untracked -m "ci: pre-pull stash"
          git pull --rebase origin main
          git stash pop

          # Re-stage and commit if anything changed
          git add scan_results/
          git add data/marketpulse.db 2>/dev/null || true

          git diff --staged --quiet \
            && echo "No data changes — nothing to commit." \
            || git commit -m "📊 Auto Scan: $(date -u +'%Y-%m-%d %H:%M UTC')"

          git push origin HEAD:main

      - name: Report Failure
        if: failure()
        run: |
          echo "## ❌ Daily Scan Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The daily MarketPulse scan workflow failed on run **${{ github.run_id }}**." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Actions Log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
