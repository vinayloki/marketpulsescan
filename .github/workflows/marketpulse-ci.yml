name: MarketPulse — Pipeline CI

# ═══════════════════════════════════════════════════════════════════════
#  Runs on every PR or push that touches pipeline/ or schemas/.
#  Completely independent from the legacy ci.yml (which tests the old
#  scanner code).
#
#  Checks:
#    1. ruff lint
#    2. ruff format
#    3. mypy type check
#    4. pytest (all 200+ unit tests)
#    5. Smoke: python -m marketpulse scan --fixture (offline bundle build)
# ═══════════════════════════════════════════════════════════════════════

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'pipeline/**'
      - 'schemas/**'
      - '.github/workflows/marketpulse-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'pipeline/**'
      - 'schemas/**'

concurrency:
  group: mp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-ci:
    name: Pipeline CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install pipeline + dev deps
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy .
        continue-on-error: true   # type stubs still catching up

      - name: Pytest
        run: pytest --tb=short -q

      - name: Smoke — fixture scan (offline bundle build)
        working-directory: .
        run: |
          python -m marketpulse scan \
            --fixture \
            --output-dir /tmp/mp-ci-bundle \
            --run-id ci-smoke
          echo "Smoke OK — files:"
          find /tmp/mp-ci-bundle -type f | sort

      - name: Validate smoke bundle
        working-directory: .
        run: |
          python -m marketpulse publish \
            --bundle-dir /tmp/mp-ci-bundle \
            --validate-only
