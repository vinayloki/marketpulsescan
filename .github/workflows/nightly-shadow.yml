name: Nightly Shadow Scan

# Runs PARALLEL to the legacy daily_scan.yml.
# Publishes the new pipeline's output to the 'data' branch staging path.
# Legacy pipeline on main is NOT touched.
#
# Green run criteria (Sprint 1):
#   - universe.json written with > 0 symbols
#   - market.json written with > 0 records
#   - manifest.json checksums valid
#
# After 5 consecutive green runs, flip production (Sprint 6).

on:
  schedule:
    # 4:30 PM IST (11:00 UTC) Mon–Fri — 15 min after legacy scan starts
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      fixture:
        description: 'Use fixture data (offline, no market download)'
        type: boolean
        default: false
      run_id:
        description: 'Override run ID (default: github run number)'
        required: false
        default: ''

concurrency:
  group: nightly-shadow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shadow-scan:
    name: Shadow Scan
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code (main branch) ────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          path: code
          fetch-depth: 0

      # ── 2. Python setup ────────────────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/pipeline/pyproject.toml

      - name: Install pipeline package
        working-directory: code/pipeline
        run: pip install -e "."

      # ── 3. Run shadow scan ─────────────────────────────────────────────────
      - name: Run shadow scan
        working-directory: code
        run: |
          RUN_ID="${{ inputs.run_id || github.run_number }}"
          FIXTURE_FLAG=""
          if [ "${{ inputs.fixture }}" == "true" ]; then
            FIXTURE_FLAG="--fixture"
          fi

          python -m marketpulse scan \
            $FIXTURE_FLAG \
            --output-dir /tmp/shadow-bundle \
            --run-id "shadow-${RUN_ID}"
        env:
          MPS_CACHE_DIR: /tmp/mps-cache
          MPS_OUTPUT_DIR: /tmp/mps-output

      # ── 4. Validate bundle ─────────────────────────────────────────────────
      - name: Validate bundle
        working-directory: code
        run: |
          python -m marketpulse publish \
            --bundle-dir /tmp/shadow-bundle \
            --validate-only

      # ── 5. Check data counts ───────────────────────────────────────────────
      - name: Verify bundle health
        run: |
          python3 - <<'EOF'
          import json, sys, pathlib

          api = pathlib.Path("/tmp/shadow-bundle/api/v1")

          with open(api / "manifest.json") as f:
              manifest = json.load(f)

          with open(api / "market.json") as f:
              market = json.load(f)

          with open(api / "universe.json") as f:
              universe = json.load(f)

          market_count   = len(market.get("data", []))
          universe_count = len(universe.get("data", []))
          file_count     = len(manifest.get("files", []))

          print(f"Universe symbols : {universe_count}")
          print(f"Market records   : {market_count}")
          print(f"Manifest files   : {file_count}")

          if universe_count == 0:
              print("ERROR: universe is empty!", file=sys.stderr)
              sys.exit(1)
          if market_count == 0:
              print("ERROR: market data is empty!", file=sys.stderr)
              sys.exit(1)
          if file_count < 3:
              print("ERROR: manifest file count < 3!", file=sys.stderr)
              sys.exit(1)

          print("Bundle health: OK")
          EOF

      # ── 6. Publish to data branch (staging path) ───────────────────────────
      - name: Publish to data branch
        run: |
          # Checkout data branch — create as orphan if it doesn't exist
          cd code
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data; then
            git fetch origin data
            git checkout data
          else
            echo "Data branch does not exist — creating orphan branch"
            git checkout --orphan data
            git rm -rf .
            git commit --allow-empty -m "data: initialize data branch"
            git push -u origin data
          fi

          # Copy shadow bundle into staging path
          mkdir -p api/v1/staging
          cp -r /tmp/shadow-bundle/api/v1/* api/v1/staging/

          git add api/
          git diff --staged --quiet \
            && echo "No data changes — nothing to commit." \
            || git commit -m "shadow: scan $(date -u +'%Y-%m-%d %H:%M UTC') run=${{ github.run_number }}"

          git push origin data

      # ── 7. Summary ─────────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          python3 - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json, pathlib, datetime

          try:
              api = pathlib.Path("/tmp/shadow-bundle/api/v1")
              with open(api / "manifest.json") as f:
                  m = json.load(f)
              with open(api / "market.json") as f:
                  market = json.load(f)
              with open(api / "universe.json") as f:
                  universe = json.load(f)

              print("## Shadow Scan Summary")
              print(f"- **Run:** ${{ github.run_number }}")
              print(f"- **Generated:** {m.get('generated_at', 'n/a')}")
              print(f"- **Universe symbols:** {len(universe.get('data', []))}")
              print(f"- **Market records:** {len(market.get('data', []))}")
              print(f"- **Staging URL:** https://vinayloki.github.io/marketpulsescan/staging/")
          except Exception as e:
              print(f"## Shadow Scan Summary")
              print(f"- **Status:** Failed to read bundle ({e})")
          EOF

      - name: Report failure
        if: failure()
        run: |
          echo "## Shadow Scan Failed" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "[View log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
