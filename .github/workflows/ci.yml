name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python pipeline checks ──────────────────────────────────────────
  pipeline-ci:
    name: Pipeline CI
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files_names || '', 'pipeline/') ||
      contains(github.event.pull_request.changed_files_names || '', 'schemas/')
    defaults:
      run:
        working-directory: pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy .

      - name: Pytest
        run: pytest --tb=short -q

  # ── Web app checks ─────────────────────────────────────────────────
  web-ci:
    name: Web CI
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      contains(github.event.pull_request.changed_files_names || '', 'apps/web/') ||
      contains(github.event.pull_request.changed_files_names || '', 'schemas/')
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build (production)
        run: npm run build
        env:
          VITE_ENV: production

      - name: Build (staging)
        run: npm run build
        env:
          VITE_ENV: staging

  # ── Data-on-code-branch guard ───────────────────────────────────────
  guard:
    name: Data Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for data files on code branch
        run: |
          # Get list of changed files in this PR
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} || true)

          # Check for forbidden patterns
          VIOLATIONS=""
          while IFS= read -r file; do
            case "$file" in
              scan_results/*|api/*|*.db|*/dist/*|data/*.json)
                VIOLATIONS="$VIOLATIONS\n  ❌ $file"
                ;;
            esac
          done <<< "$CHANGED"

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Data files detected on code branch! These belong on the 'data' branch."
            echo -e "Violations:$VIOLATIONS"
            exit 1
          fi

          echo "✅ No data files on code branch"
